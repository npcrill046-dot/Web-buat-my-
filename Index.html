<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aira — Interactive Character</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --pink: #f3a8ce;
    --pink-light: #ffe2f0;
    --purple: #8e6ca8;
    --dark: #241c2c;
    --panel: rgba(255, 255, 255, 0.86);
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: var(--dark);

    background:
        radial-gradient(circle at 20% 10%, #ffdced, transparent 30%),
        radial-gradient(circle at 90% 80%, #9e7bb3, transparent 30%),
        linear-gradient(135deg, #201a2a, #513957);

    overflow: hidden;
}

/* =========================
   MAIN LAYOUT
========================= */

.app {
    width: 100%;
    height: 100vh;

    display: grid;
    grid-template-columns: 1fr 320px;

    gap: 15px;
    padding: 15px;
}

/* =========================
   GAME AREA
========================= */

.stage {
    position: relative;
    overflow: hidden;

    border-radius: 28px;

    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(255, 208, 235, 0.25),
            transparent 25%
        ),
        linear-gradient(
            160deg,
            rgba(255,255,255,0.08),
            rgba(0,0,0,0.2)
        );

    border: 1px solid rgba(255,255,255,0.2);

    box-shadow:
        0 20px 70px rgba(0,0,0,0.35);
}

/* =========================
   TITLE
========================= */

.title {
    position: absolute;
    left: 25px;
    top: 20px;

    z-index: 10;
}

.title h1 {
    margin: 0;

    font-size: 30px;

    color: white;

    text-shadow:
        0 3px 15px rgba(0,0,0,0.4);
}

.title p {
    margin-top: 3px;

    font-size: 13px;

    color: rgba(255,255,255,0.7);
}

/* =========================
   STARS
========================= */

.star {
    position: absolute;

    color: white;

    opacity: 0.6;

    animation: twinkle 2s infinite alternate;
}

.star1 {
    left: 10%;
    top: 18%;
}

.star2 {
    left: 80%;
    top: 15%;

    animation-delay: 0.7s;
}

.star3 {
    left: 70%;
    top: 60%;

    animation-delay: 1.2s;
}

.star4 {
    left: 20%;
    top: 70%;

    animation-delay: 1.7s;
}

@keyframes twinkle {

    from {
        opacity: 0.15;
        transform: scale(0.7);
    }

    to {
        opacity: 0.9;
        transform: scale(1.2);
    }
}

/* =========================
   AIRA
========================= */

.character {
    position: absolute;

    width: 300px;
    height: 440px;

    left: 50%;
    top: 53%;

    transform:
        translate(-50%, -50%);

    cursor: grab;

    touch-action: none;

    user-select: none;

    transition:
        filter 0.3s;
}

.character.dragging {
    cursor: grabbing;

    filter:
        drop-shadow(
            0 20px 35px
            rgba(244,160,207,0.5)
        );
}

/* =========================
   HEAD
========================= */

.head {

    position: absolute;

    width: 180px;
    height: 180px;

    left: 60px;
    top: 45px;

    border-radius:
        50%
        50%
        45%
        45%;

    background:
        linear-gradient(
            150deg,
            #fff3f9,
            #ffd2e7
        );

    border:
        4px solid #332638;

    z-index: 5;

    box-shadow:
        inset 0 -10px 25px
        rgba(230,130,180,0.15);
}

/* =========================
   HAIR
========================= */

.hair {

    position: absolute;

    width: 205px;
    height: 200px;

    left: -16px;
    top: -15px;

    border-radius:
        55%
        55%
        40%
        40%;

    background:
        linear-gradient(
            90deg,
            #332638 0%,
            #332638 32%,
            #f0a4c8 32%,
            #f0a4c8 73%,
            #c879a5 73%
        );

    z-index: -1;
}

/* =========================
   BANG
========================= */

.bang {

    position: absolute;

    width: 130px;
    height: 80px;

    top: 5px;
    left: 25px;

    background: #efa4c7;

    border-radius:
        40%
        50%
        50%
        20%;

    transform: rotate(-5deg);
}

/* =========================
   EYES
========================= */

.eye {

    position: absolute;

    width: 28px;
    height: 38px;

    top: 80px;

    border-radius: 50%;

    background: #332638;

    border: 3px solid white;

    box-shadow:
        0 0 0 2px #332638;
}

.eye::after {

    content: "";

    position: absolute;

    width: 7px;
    height: 11px;

    background: white;

    border-radius: 50%;

    left: 5px;
    top: 4px;
}

.eye.left {
    left: 40px;
}

.eye.right {
    right: 40px;
}

/* =========================
   MOUTH
========================= */

.mouth {

    position: absolute;

    left: 50%;
    top: 127px;

    width: 25px;
    height: 12px;

    border-bottom:
        3px solid #9b4d70;

    border-radius: 50%;

    transform:
        translateX(-50%);
}

/* =========================
   RIBBON
========================= */

.ribbon {

    position: absolute;

    right: -24px;
    top: 0;

    font-size: 38px;

    transform: rotate(15deg);
}

/* =========================
   BODY
========================= */

.body {

    position: absolute;

    width: 145px;
    height: 210px;

    left: 78px;
    top: 210px;

    border-radius:
        70px
        70px
        30px
        30px;

    background:
        linear-gradient(
            160deg,
            white,
            #f6c8df
        );

    border:
        4px solid #332638;
}

/* =========================
   DRESS
========================= */

.dress {

    position: absolute;

    width: 170px;
    height: 80px;

    left: -16px;
    bottom: 0;

    background: #332638;

    clip-path:
        polygon(
            15% 0,
            85% 0,
            100% 100%,
            0 100%
        );
}

/* =========================
   BOW
========================= */

.bow {

    position: absolute;

    left: 50%;
    bottom: 42px;

    transform:
        translateX(-50%);

    font-size: 40px;

    z-index: 3;
}

/* =========================
   ARMS
========================= */

.arm {

    position: absolute;

    width: 42px;
    height: 100px;

    background: #f7cee2;

    border:
        4px solid #332638;

    border-radius: 30px;

    top: 35px;
}

.arm.left {

    left: -30px;

    transform:
        rotate(18deg);
}

.arm.right {

    right: -30px;

    transform:
        rotate(-18deg);
}

/* =========================
   CHOKER
========================= */

.choker {

    position: absolute;

    width: 70px;
    height: 14px;

    background: #332638;

    border-radius: 10px;

    left: 50%;
    bottom: 30px;

    transform:
        translateX(-50%);
}

.gem {

    position: absolute;

    width: 13px;
    height: 13px;

    background: var(--pink);

    border:
        2px solid #332638;

    transform:
        rotate(45deg);

    left: 28px;
    top: 7px;
}

/* =========================
   SIDE PANEL
========================= */

.panel {

    background: var(--panel);

    border-radius: 24px;

    padding: 20px;

    backdrop-filter: blur(15px);

    display: flex;

    flex-direction: column;

    gap: 14px;

    overflow-y: auto;
}

.panel h2 {

    margin: 0;

    font-size: 22px;
}

.mode {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 12px;

    border-radius: 15px;

    background: #f7edf4;
}

.mode span {

    font-size: 12px;

    opacity: 0.65;
}

/* =========================
   DIALOGUE
========================= */

.dialogue {

    min-height: 90px;

    display: flex;

    align-items: center;

    padding: 15px;

    border-radius: 17px;

    background: white;

    border: 1px solid rgba(0,0,0,0.08);

    line-height: 1.5;

    font-size: 14px;
}

/* =========================
   AFFECTION
========================= */

.stat {

    font-size: 13px;

    font-weight: bold;
}

.bar {

    width: 100%;

    height: 10px;

    margin-top: 7px;

    overflow: hidden;

    border-radius: 20px;

    background: #eadde6;
}

.fill {

    height: 100%;

    width: 37%;

    background:
        linear-gradient(
            90deg,
            #f39bc5,
            #a984c4
        );

    transition:
        width 0.4s;
}

/* =========================
   BUTTONS
========================= */

.buttons {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;
}

button {

    border: 0;

    padding: 12px;

    border-radius: 14px;

    background: white;

    color: var(--dark);

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 4px 12px
        rgba(50,30,60,0.1);

    transition:
        transform 0.15s,
        background 0.2s;
}

button:active {

    transform:
        scale(0.95);
}

button.primary {

    background: #332638;

    color: white;
}

/* =========================
   HINT
========================= */

.hint {

    font-size: 12px;

    line-height: 1.5;

    opacity: 0.65;
}

/* =========================
   SHADOW MODE
========================= */

.shadow-mode .head {

    background:
        linear-gradient(
            150deg,
            #e3d6e8,
            #ad91ba
        );
}

.shadow-mode .hair {

    background:
        linear-gradient(
            90deg,
            #17131d,
            #3a2945 50%,
            #70476c
        );
}

.shadow-mode .eye {

    background: #80134d;
}

.shadow-mode .body {

    background:
        linear-gradient(
            160deg,
            #eee2ef,
            #c1a8c8
        );
}

.shadow-mode .mouth {

    border-bottom-color:
        #68123e;
}

/* =========================
   MOBILE
========================= */

@media(max-width: 760px) {

    body {
        overflow: auto;
    }

    .app {

        height: auto;

        min-height: 100vh;

        grid-template-columns:
            1fr;

        padding: 10px;
    }

    .stage {

        height: 65vh;

        min-height: 500px;
    }

    .panel {

        min-height: 400px;
    }

    .character {

        transform:
            translate(-50%, -50%)
            scale(0.82);
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- =====================
         GAME STAGE
    ====================== -->

    <section
        class="stage"
        id="stage"
    >

        <div class="title">

            <h1>✦ Aira</h1>

            <p>
                Dua kepribadian · satu hati
            </p>

        </div>


        <!-- STARS -->

        <div class="star star1">✦</div>
        <div class="star star2">✧</div>
        <div class="star star3">✦</div>
        <div class="star star4">✧</div>


        <!-- =====================
             AIRA CHARACTER
        ====================== -->

        <div
            class="character"
            id="character"
        >

            <div class="head">

                <div class="hair"></div>

                <div class="bang"></div>

                <div class="eye left"></div>
                <div class="eye right"></div>

                <div class="mouth"></div>

                <div class="ribbon">
                    🎀
                </div>

            </div>


            <div class="arm left"></div>
            <div class="arm right"></div>


            <div class="body">

                <div class="dress"></div>

                <div class="bow">
                    🎀
                </div>

                <div class="choker">

                    <div class="gem"></div>

                </div>

            </div>

        </div>

    </section>


    <!-- =====================
         CONTROL PANEL
    ====================== -->

    <aside class="panel">

        <h2>
            Aira
        </h2>


        <div class="mode">

            <strong id="modeText">
                Mode: Tsundere
            </strong>

            <span id="moodText">
                Shy
            </span>

        </div>


        <div
            class="dialogue"
            id="dialogue"
        >

            “Hmph... ngapain datang?
            B-bukan berarti aku senang
            kamu datang!”

        </div>


        <!-- AFFECTION -->

        <div class="stat">

            ❤️ Affection

            <span id="affectionText">
                37%
            </span>

            <div class="bar">

                <div
                    class="fill"
                    id="affectionFill"
                ></div>

            </div>

        </div>


        <!-- BUTTONS -->

        <div class="buttons">

            <button
                class="primary"
                onclick="talk()"
            >
                Bicara
            </button>


            <button
                onclick="touch()"
            >
                Sentuh
            </button>


            <button
                onclick="gift()"
            >
                Hadiah
            </button>


            <button
                onclick="togglePersonality()"
            >
                Ganti Mode
            </button>

        </div>


        <div class="hint">

            Geser Aira dengan jari atau mouse.
            Kamu juga bisa berinteraksi melalui
            tombol di atas.

        </div>

    </aside>

</div>


<script>

/* ==================================================
   AIRA SYSTEM
================================================== */

const character =
    document.getElementById("character");

const stage =
    document.getElementById("stage");

const dialogue =
    document.getElementById("dialogue");

const affectionFill =
    document.getElementById("affectionFill");

const affectionText =
    document.getElementById("affectionText");

const modeText =
    document.getElementById("modeText");

const moodText =
    document.getElementById("moodText");


/* ==================================================
   VARIABLES
================================================== */

let affection = 37;

let shadowMode = false;

let dragging = false;

let offsetX = 0;

let offsetY = 0;


/* ==================================================
   DIALOGUE
================================================== */

const tsundereDialogue = [

    "Hmph... ngapain datang? B-bukan berarti aku senang kamu datang!",

    "Jangan salah paham! Aku cuma kebetulan sedang tidak sibuk.",

    "...Kamu datang lagi. Ya sudah, duduk sana.",

    "Kalau kamu pergi lama-lama... aku mungkin sedikit kesal.",

    "Aku tidak menunggumu, kok. Sama sekali tidak.",

    "Jangan lihat aku terus! Bikin malu saja..."

];


const shadowDialogue = [

    "Oh... kamu kembali.",

    "Jangan terlalu lama pergi. Aku tidak suka menunggu.",

    "Di sini aman. Tetaplah di dekatku.",

    "Hehe... akhirnya aku bisa bicara tanpa berpura-pura.",

    "Aku lebih suka saat hanya ada kita di sini.",

    "Jangan khawatir... aku akan selalu mengingatmu."

];


/* ==================================================
   RANDOM DIALOGUE
================================================== */

function say(list) {

    const index =
        Math.floor(
            Math.random() * list.length
        );

    dialogue.textContent =
        "“" + list[index] + "”";
}


/* ==================================================
   UPDATE UI
================================================== */

function updateUI() {

    affectionFill.style.width =
        affection + "%";

    affectionText.textContent =
        affection + "%";


    if (shadowMode) {

        modeText.textContent =
            "Mode: ??? — Shadow";

        moodText.textContent =
            "Possessive";

        stage.classList.add(
            "shadow-mode"
        );

    } else {

        modeText.textContent =
            "Mode: Tsundere";

        moodText.textContent =
            "Shy";

        stage.classList.remove(
            "shadow-mode"
        );
    }

}


/* ==================================================
   BICARA
================================================== */

function talk() {

    affection =
        Math.min(
            100,
            affection + 2
        );


    if (shadowMode) {

        say(
            shadowDialogue
        );

    } else {

        say(
            tsundereDialogue
        );

    }


    updateUI();
}


/* ==================================================
   SENTUH
================================================== */

function touch() {

    affection =
        Math.min(
            100,
            affection + 4
        );


    if (shadowMode) {

        dialogue.textContent =
            "“...Kamu menyentuhku?”";

    } else {

        dialogue.textContent =
            "“E-eh?! Jangan tiba-tiba begitu!”";

    }


    updateUI();
}


/* ==================================================
   HADIAH
================================================== */

function gift() {

    affection =
        Math.min(
            100,
            affection + 7
        );


    if (shadowMode) {

        dialogue.textContent =
            "“Hadiah dari kamu... akan kusimpan baik-baik.”";

    } else {

        dialogue.textContent =
            "“I-ini buat aku? ...Makasih.”";

    }


    updateUI();
}


/* ==================================================
   GANTI KEPRIBADIAN
================================================== */

function togglePersonality() {

    shadowMode =
        !shadowMode;


    if (shadowMode) {

        dialogue.textContent =
            "“Hehe... akhirnya kamu melihat sisi diriku yang lain.”";

    } else {

        dialogue.textContent =
            "“Hmph! Jangan berharap aku akan selalu menunjukkan sisi itu!”";

    }


    updateUI();
}


/* ==================================================
   DRAG SYSTEM
================================================== */

function startDrag(event) {

    dragging = true;

    character.classList.add(
        "dragging"
    );


    const rect =
        character.getBoundingClientRect();


    const pointer =
        event.touches
            ? event.touches[0]
            : event;


    offsetX =
        pointer.clientX -
        rect.left;


    offsetY =
        pointer.clientY -
        rect.top;
}


/* ==================================================
   MOVE
================================================== */

function moveCharacter(event) {

    if (!dragging) {
        return;
    }


    event.preventDefault();


    const pointer =
        event.touches
            ? event.touches[0]
            : event;


    const stageRect =
        stage.getBoundingClientRect();


    const width =
        character.offsetWidth;


    const height =
        character.offsetHeight;


    let x =
        pointer.clientX -
        stageRect.left -
        offsetX;


    let y =
        pointer.clientY -
        stageRect.top -
        offsetY;


    /* batas kiri-kanan */

    x =
        Math.max(
            -30,
            Math.min(
                stageRect.width -
                width +
                30,
                x
            )
        );


    /* batas atas-bawah */

    y =
        Math.max(
            80,
            Math.min(
                stageRect.height -
                height +
                50,
                y
            )
        );


    character.style.left =
        (x + width / 2) + "px";


    character.style.top =
        (y + height / 2) + "px";


    character.style.transform =
        "translate(-50%, -50%)";
}


/* ==================================================
   STOP DRAG
================================================== */

function stopDrag() {

    dragging = false;

    character.classList.remove(
        "dragging"
    );
}


/* ==================================================
   MOUSE
================================================== */

character.addEventListener(
    "mousedown",
    startDrag
);
